[harvest_basket]
	#
	#Radius of the harvest basket collection. Set to 0 to disable. Default: 7
	#Range: 0 ~ 20
	HarvestBasketRange = 7

[syringe_blacklist]
	#Blacklist of entity IDs that cannot be sampled by the DNA syringe. Can be empty.
	syringeBlacklist = []

[world_generation]
	#Per-dimension worldgen version overrides. Normally the version used during world 
	#creation is stored in SavedData and used automatically. Set an entry here to force 
	#a specific version regardless of what was recorded at generation time. 
	#Changing this for an existing world can cause chunk boundary artifacts. 
	#Format: list of "dimension_id=version", e.g. ["minecraft:overworld=1"]
	worldgenOverrides = []

[mars_climate]
	#The chance that sand piles will accumulate during a sandstorm. Lower values = faster sand pile accumulation, but also more block updates (aka lag).
	#Range: > 1
	sandAccumulateChance = 20
	#The chance that sand piles will decumulate during a sandstoem. Lower values = faster sand dispersal, but also more block updates (aka lag).
	#Range: > 1
	sandDecumulateChance = 36

[overworld_climate]
	#Enables instant snow and ice removal as chunks are loaded in and the temperature is warm enough.
	enableSnowCorrection = true
	#The maximum amount of snow update to apply for each correction tick
	#Range: > 1
	snowMaxAccumulationOnUpdate = 256

[tfg_food_effects]
	#Enables TFG food debuff effects. Allows receiving harmful effects from contaminants like Toxins, or transient nutrients like Freezing.
	enableTFGFoodDebuffs = true
	#Enables TFG food buff effects. Allows receiving helpful effects from nutrients like Fruits, or transient nutrients like Fulfilling.
	enableTFGFoodBuffs = true
	#The maximum distance a javelin can travel from the player when leashed before it stops (in blocks). Default: 16
	#Range: 1 ~ 64
	javelinLeashMaxDistance = 16

[mining_restrictions]
	#Enables restrictions on automatic mining machines in the Beneath.
	enableBeneathMiningRestrictions = true
	#Below this Y level, single block gregtech miners and create contraptions cannot mine ores.
	#Range: > 1
	disabledBeneathMiningYLevel = 80
	#Enables restrictions on automatic mining machines on hot planets.
	enableHotPlanetMiningRestrictions = true

[chameleon_spray_can]
	#
	#The maximum Prismatic Paint capacity of the Chameleon Spray Can (in mB). Default: 8000
	#Range: > 1
	chameleonSprayCanCapacity = 2000
	#
	#The amount of Prismatic Paint consumed per block/entity recolored (in mB). Default: 1
	#Range: > 0
	chameleonSprayCanCostPerOperation = 1
	#
	#The fluid consumption multiplier applied when chain-painting/bulk-painting blocks (e.g. 0.85 equals a 15% discount). Set to 1.0 to disable discounts.
	#Range: 0.0 ~ 10.0
	chameleonSprayCanBulkMultiplier = 1.0

[glassblowing]
	#
	#Base glassblowing duration in ticks. Default: 40, min: 2, max: maxInt
	#Range: > 2
	baseGlassblowingCooldown = 40

[tfc_create_compatibility]
	#
	#Stress impact multiplier for the quern. Default: 0.25, min: 0, max: 64
	#Range: 0.0 ~ 64.0
	quernStressImpact = 0.25
	#
	#RPM limit of the quern. Values over 32 may lead to broken animations! Default: 32, min: 1, max: intMax
	#Range: > 1
	quernRpmLimit = 32
	#
	#Stress limit of the quern. Default: 8, min: 1, max: intMax
	#Range: > 1
	quernStressLimit = 8
	#
	#Stress impact multiplier for the bellows. Default: 0.5, min: 0, max: 64
	#Range: 0.0 ~ 64.0
	bellowsStressImpact = 0.5
	#
	#Stress limit of the bellows. Default: 8, min: 1, max: intMax
	#Range: > 1
	bellowsStressLimit = 8
	#
	#RPM limit of the bellows. Values over 16 may lead to broken animations! Default: 16, min: 1, max: intMax
	#Range: > 1
	bellowsRpmLimit = 16
	#
	#Stress impact multiplier for the compost tumbler. Default: 0.25, min: 0, max: 64
	#Range: 0.0 ~ 64.0
	composterStressImpact = 0.25
	#
	#Stress limit of the compost tumbler. Default: 8, min: 1, max: intMax
	#Range: > 1
	composterStressLimit = 8
	#
	#RPM limit of the compost tumbler. Values over 32 may lead to broken animations! RPM does not have any affect on the compost tumbler functionality. Default: 32, min: 1, max: intMax
	#Range: > 1
	composterRpmLimit = 32

